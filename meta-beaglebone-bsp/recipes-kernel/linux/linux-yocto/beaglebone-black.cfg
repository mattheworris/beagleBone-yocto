# beaglebone-black.cfg — Kernel config fragment for BeagleBone Black
#
# CONCEPT: Config fragments (.cfg files) let you enable or disable specific
# kernel options on top of the base defconfig (omap2plus_defconfig in our case).
# They are applied by linux-yocto after running 'make omap2plus_defconfig',
# so you only need to list options that differ from the base defconfig.
#
# This is preferable to maintaining a full defconfig because:
#   - The base defconfig handles the hundreds of correct defaults
#   - We only document our intentional additions/changes
#   - When omap2plus_defconfig is updated upstream, we inherit the fixes

# Enable MMU (Memory Management Unit) support.
#
# linux-yocto uses merge_config.sh with the -n flag (allnoconfig base) when
# a sources/defconfig is present. omap2plus_defconfig assumes MMU is always
# on and does not explicitly set CONFIG_MMU, so it stays off from the
# allnoconfig base. We must set it explicitly.
#
# Without MMU=y: CPU_THUMBONLY becomes selectable (its dep is !MMU), which
# forces THUMB2_KERNEL=y unconditionally (no user prompt), breaking U-Boot
# boot. With MMU=y the entire chain is fixed.
CONFIG_MMU=y

# Enable ARMv7 multi-platform support.
#
# The BBB's AM335x SoC uses a Cortex-A8 (ARMv7, MIDR 0x413fc082).
# omap2plus_defconfig enables ARCH_MULTI_V6 for the OMAP2 family (ARM11/ARMv6)
# but with the allnoconfig base ARCH_MULTI_V7 is not set, leaving the kernel
# built ARMv6-only. The decompressor then reports "unrecognized/unsupported
# processor variant" and halts because it doesn't know how to handle ARMv7
# cache/TLB operations. ARCH_MULTI_V7 selects CPU_V7 which covers Cortex-A8.
CONFIG_ARCH_MULTI_V7=y

# Enable auto-detection of the kernel relocation address (ZRELADDR).
#
# With AUTO_ZRELADDR=n, the decompressor uses a hardcoded ZRELADDR calculated
# at compile time from CONFIG_PHYS_OFFSET. omap2plus_defconfig sets
# PHYS_OFFSET=0x00800000 (generic OMAP default), giving ZRELADDR=0x00808000
# instead of the correct 0x80008000 for BBB (DRAM at 0x80000000). The
# decompressor then tries to write the uncompressed kernel to ~0x00004000,
# which is not DRAM — causing an immediate data abort.
#
# With AUTO_ZRELADDR=y, the decompressor uses:
#   zreladdr = (PC & 0xf8000000) + TEXT_OFFSET
# PC is inside the zImage at 0x82000xxx, so: 0x80000000 + 0x8000 = 0x80008000
# This is correct for BBB regardless of the compile-time PHYS_OFFSET value.
CONFIG_AUTO_ZRELADDR=y

# Disable Thumb-2 kernel compilation.
#
# omap2plus_defconfig enables THUMB2_KERNEL, but it causes a boot crash on BBB.
# U-Boot's bootz command jumps to the zImage entry point in ARM mode.
# With THUMB2_KERNEL=y, the zImage decompressor (head.S) is Thumb-2 code.
# U-Boot doesn't set bit 0 of PC before jumping, so the CPU enters ARM mode
# and misinterprets the Thumb-2 instructions as ARM — execution falls through
# the header to offset 0x2c and causes a data abort.
#
# Fix: build the kernel in ARM mode. The performance difference on Cortex-A8
# is negligible, and this matches what BeagleBone BSPs have always used.
# CONFIG_THUMB2_KERNEL is not set

# Disable appended-DTB support.
#
# omap2plus_defconfig enables ARM_APPENDED_DTB for boards that concatenate
# the DTB onto the end of zImage. We pass the DTB separately via extlinux.conf
# (fdt /am335x-boneblack.dtb), so this is not needed.
# CONFIG_ARM_APPENDED_DTB is not set

# Enable DMA support for the 8250/16550 UART driver.
#
# The AM335x UART is connected to the EDMA (Enhanced DMA) controller.
# With DMA enabled, large bursts of serial output are transferred via DMA
# rather than byte-by-byte interrupts, reducing CPU overhead and preventing
# FIFO overruns that cause character drops at 115200 baud.
CONFIG_SERIAL_8250_DMA=y
