# beaglebone-black.cfg — Kernel config fragment for BeagleBone Black
#
# CONCEPT: Config fragments (.cfg files) let you enable or disable specific
# kernel options on top of the base defconfig (omap2plus_defconfig in our case).
# They are applied by linux-yocto after running 'make omap2plus_defconfig',
# so you only need to list options that differ from the base defconfig.
#
# This is preferable to maintaining a full defconfig because:
#   - The base defconfig handles the hundreds of correct defaults
#   - We only document our intentional additions/changes
#   - When omap2plus_defconfig is updated upstream, we inherit the fixes

# Disable Thumb-2 kernel compilation.
#
# omap2plus_defconfig enables THUMB2_KERNEL, but it causes a boot crash on BBB.
# U-Boot's bootz command jumps to the zImage entry point in ARM mode.
# With THUMB2_KERNEL=y, the zImage decompressor (head.S) is Thumb-2 code.
# U-Boot doesn't set bit 0 of PC before jumping, so the CPU enters ARM mode
# and misinterprets the Thumb-2 instructions as ARM — execution falls through
# the header to offset 0x2c and causes a data abort.
#
# Fix: build the kernel in ARM mode. The performance difference on Cortex-A8
# is negligible, and this matches what BeagleBone BSPs have always used.
# CONFIG_THUMB2_KERNEL is not set

# Disable appended-DTB support.
#
# omap2plus_defconfig enables ARM_APPENDED_DTB for boards that concatenate
# the DTB onto the end of zImage. We pass the DTB separately via extlinux.conf
# (fdt /am335x-boneblack.dtb), so this is not needed.
# CONFIG_ARM_APPENDED_DTB is not set
