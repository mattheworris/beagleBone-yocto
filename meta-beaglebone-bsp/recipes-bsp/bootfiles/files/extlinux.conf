# extlinux.conf — U-Boot distro boot configuration
#
# Modern U-Boot (2019+) uses "distro boot" which searches for this file
# on the boot partition before trying EFI, network, etc. This replaces
# the older uEnv.txt / boot.scr approach.
#
# U-Boot searches for extlinux/extlinux.conf on each partition in order.
# All paths here are relative to the FAT boot partition root.

default linux
timeout 1

label linux
    kernel /zImage
    fdt /am335x-boneblack.dtb
    append root=/dev/mmcblk0p2 rw rootwait console=ttyS0,115200n8
