# beaglebone-black.conf — Machine configuration for BeagleBone Black
#
# The BeagleBone Black is based on the Texas Instruments AM335x SoC,
# which contains an ARM Cortex-A8 core with NEON SIMD and VFPv3 FPU.
#
# Hardware reference:
#   SoC:    TI AM335x (SPRUH73 Technical Reference Manual)
#   Board:  BeagleBone Black System Reference Manual (Rev C)
#   Boot:   ROM → MLO (SPL, 110KB max) → U-Boot → Kernel+DTB → rootfs

# =============================================================================
# CPU ARCHITECTURE TUNING
# =============================================================================
#
# DEFAULTTUNE tells BitBake which GCC -march/-mtune/-mfpu flags to use when
# compiling *everything* for this machine. Getting this right means your
# binaries use the hardware FPU and NEON instructions — significant speedup
# for anything doing math or media processing.
#
# "cortexa8hf-neon" breaks down as:
#   cortexa8  = ARM Cortex-A8 CPU (-mcpu=cortex-a8)
#   hf        = hard-float ABI (FPU registers used for function args)
#   neon      = NEON SIMD unit enabled (-mfpu=neon)
#
# The "hf" (hard-float) vs "sf" (soft-float) distinction matters for
# interoperability: all libraries must be compiled with the same ABI.
DEFAULTTUNE = "cortexa8hf-neon"

# This include sets the actual GCC flags corresponding to DEFAULTTUNE.
# It lives in OE-Core (meta/conf/machine/include/arm/armv7a/).
require conf/machine/include/arm/armv7a/tune-cortexa8.inc

# =============================================================================
# KERNEL PROVIDER
# =============================================================================
#
# Yocto uses "virtual providers" — an abstraction layer that lets you swap
# implementations without changing the recipes that depend on them.
# virtual/kernel is the kernel recipe. We use linux-yocto, the kernel recipe
# maintained by the Yocto Project that tracks upstream stable releases with
# Yocto-specific patches applied.
#
# Alternative: you could set this to "linux-ti-mainline" or a custom recipe.
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"

# KERNEL_IMAGETYPE: The binary format the bootloader expects. U-Boot on
# ARM typically loads a zImage (self-decompressing compressed kernel).
KERNEL_IMAGETYPE = "zImage"

# KERNEL_DEVICETREE: The Device Tree Source file(s) to compile into DTBs.
# The DTB describes the hardware topology to the kernel at boot time —
# which peripherals exist, their addresses, interrupt lines, clocks, etc.
# This file lives in the Linux kernel source tree under:
#   arch/arm/boot/dts/ti/omap/am335x-boneblack.dts
#
# Concept: Device Tree decouples the kernel from the hardware. Instead of
# #ifdef ARM_BBB scattered through drivers, the driver reads the DTB at
# runtime to discover what hardware is present. This is why the same kernel
# binary can boot many different ARM boards.
KERNEL_DEVICETREE = "ti/omap/am335x-boneblack.dtb"

# =============================================================================
# BOOTLOADER (U-BOOT)
# =============================================================================
#
# The AM335x boot ROM has a fixed sequence: it looks for a file named "MLO"
# on the first FAT partition of the SD/eMMC, loads it to internal SRAM
# (only 64KB usable), and executes it. This is the SPL (Secondary Program
# Loader), also called MLO (Memory LOader). The SPL initializes DRAM, then
# loads the full U-Boot image (u-boot.img) into DRAM and jumps to it.
#
# This two-stage boot exists because the AM335x ROM code can only load
# ~110KB into SRAM — not enough for a full U-Boot. The SPL is a stripped-
# down U-Boot configured to do only what's needed to get DRAM running.
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"

# UBOOT_MACHINE: The defconfig to use when building U-Boot. This maps to
# configs/am335x_evm_defconfig in the U-Boot source tree. The "EVM"
# (Evaluation Module) config supports the BeagleBone Black because TI's
# EVM uses the same AM335x SoC family with the same DRAM init sequence.
UBOOT_MACHINE = "am335x_evm_defconfig"

# SPL_BINARY: Tells Yocto the SPL output filename. The AM335x ROM code
# specifically looks for a file named "MLO" — this is not negotiable.
SPL_BINARY = "MLO"

# Load/entry addresses for the kernel in DRAM. U-Boot copies zImage to
# UBOOT_LOADADDRESS, then jumps to UBOOT_ENTRYPOINT to start it.
# 0x80008000 is the standard ARM Linux load address (128MB + 32KB offset,
# leaving room for U-Boot's ATAGs/FDT at the start of DRAM).
UBOOT_ENTRYPOINT = "0x80008000"
UBOOT_LOADADDRESS = "0x80008000"

# =============================================================================
# BOOT PARTITION CONTENTS
# =============================================================================
#
# IMAGE_BOOT_FILES lists the files placed on the FAT boot partition.
# The order matters to the AM335x ROM: MLO must be the first file written
# to FAT (the ROM finds it by scanning the FAT directory table, and some
# implementations require it at a specific cluster). Yocto's wic tool
# handles this correctly.
# The AM335x SPL (MLO) loads u-boot.img (legacy image format).
# Modern U-Boot uses distro boot, which searches for extlinux/extlinux.conf
# on the FAT partition. The kernel and DTB must also be on the FAT partition
# so U-Boot can load them before the rootfs is mounted.
IMAGE_BOOT_FILES = "MLO u-boot.img zImage am335x-boneblack.dtb extlinux.conf;extlinux/extlinux.conf"

# =============================================================================
# SERIAL CONSOLE
# =============================================================================
#
# The kernel console and getty (login prompt) configuration.
# Format: "baudrate;ttyDevice"
#   115200  = baud rate (matches U-Boot's default for the BBB)
#   ttyS0   = UART0, exposed on the J1 6-pin header (pins 1=GND,4=RX,5=TX)
#
# To connect: use a 3.3V FTDI cable or USB-UART adapter at 115200 8N1.
# You'll see the full boot log here — essential for debugging BSP issues.
SERIAL_CONSOLES = "115200;ttyS0"

# =============================================================================
# IMAGE / FILESYSTEM OUTPUT FORMATS
# =============================================================================
#
# IMAGE_FSTYPES controls what output files BitBake generates after building
# the root filesystem:
#   tar.bz2  = compressed tarball of rootfs (useful for NFS or inspection)
#   ext4     = ext4 filesystem image (raw rootfs partition)
#   wic      = complete disk image with partitions (ready to dd to SD card)
#
# The .wic format is the most useful for deployment: it's a raw disk image
# with a proper partition table, FAT boot partition (with MLO+u-boot.img),
# and ext4 rootfs partition. Flash it with: dd if=image.wic of=/dev/sdX
# wic.bmap is a block map file used by bmaptool to flash only the non-empty
# blocks of the wic image — much faster than dd for sparse images.
IMAGE_FSTYPES = "tar.bz2 ext4 wic wic.bmap"

# WKS_FILE: The WIC kickstart file that defines the partition layout for
# the .wic image. "beaglebone-black.wks" will describe:
#   - Partition 1: FAT16, ~4MB, bootable, contains MLO + u-boot.img
#   - Partition 2: ext4, remainder of card, contains rootfs
WKS_FILE = "beaglebone-black.wks"

# =============================================================================
# IMAGE DEPENDENCIES
# =============================================================================
#
# EXTRA_IMAGEDEPENDS: Recipes that must be built and deployed before the
# image is assembled, but are NOT installed into the rootfs.
# U-Boot falls into this category — it lives on the FAT boot partition,
# not in the Linux rootfs. Without this, BitBake won't build U-Boot at all
# since nothing in the rootfs package graph depends on it.
EXTRA_IMAGEDEPENDS += "u-boot bootfiles"
