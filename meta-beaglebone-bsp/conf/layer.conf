# layer.conf — registers meta-beaglebone-bsp with BitBake
#
# CONCEPT: Every Yocto layer must have this file. BitBake scans BBLAYERS
# (from bblayers.conf) and reads each layer.conf to learn:
#   - Where to find recipes in this layer
#   - What this layer's priority is
#   - What other layers this layer depends on
#   - Which Yocto releases this layer is compatible with

# BBPATH: The colon-separated list of directories BitBake searches for
# configuration files and classes. We prepend our layer's root directory
# so BitBake can find our conf/machine/*.conf files.
BBPATH .= ":${LAYERDIR}"

# BBFILES: Glob patterns telling BitBake where to find recipes (.bb) and
# recipe appends (.bbappend) in this layer. The ** means "recurse into
# all subdirectories."
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# BBFILE_COLLECTIONS: A unique name for this layer. BitBake uses this
# internally to track which layer owns which files. Must be unique across
# all layers in your build.
BBFILE_COLLECTIONS += "beaglebone-bsp"

# BBFILE_PATTERN: A regex that matches the paths of files belonging to
# this collection. Used by BitBake to associate recipe files with layers.
BBFILE_PATTERN_beaglebone-bsp = "^${LAYERDIR}/"

# BBFILE_PRIORITY: When two layers provide the same recipe, the one with
# the higher priority wins. OE-Core (meta) uses 5. BSP layers typically
# use 6 so they can override core recipes when needed.
BBFILE_PRIORITY_beaglebone-bsp = "6"

# LAYERDEPENDS: Layers that must be present for this layer to work.
# "core" is the OE-Core layer (meta/). We depend on it because we use
# its virtual providers (virtual/kernel, virtual/bootloader) and classes.
LAYERDEPENDS_beaglebone-bsp = "core"

# LAYERSERIES_COMPAT: The Yocto release codename(s) this layer is tested
# against. BitBake warns (or errors) if you try to use a layer whose
# LAYERSERIES_COMPAT doesn't include the current release. This prevents
# accidentally using a stale BSP with an incompatible Yocto version.
LAYERSERIES_COMPAT_beaglebone-bsp = "whinlatter blacksail"
